services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KADAI_DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - kadai_data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

volumes:
  kadai_data:
  ollama_models:
